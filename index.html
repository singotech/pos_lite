  <!-- Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script type="text/javascript">
    var scannerBeepSound = new Audio("./assets/beep.mp3")
    var scannerErrorSound = new Audio("./assets/error.mp3")

    function playScannerSound(sound) {
      sound.currentTime = 0
      var playback = sound.play()
      if (playback && typeof playback.catch === "function") {
        playback.catch(function (error) {
          console.error("Unable to play barcode scanner feedback sound.", error)
        })
      }
    }

    function onScanSuccess(decodedText, decodedResult) {
      html5QrcodeScanner.pause()
      setTimeout(onNextScan, 1500)
      onScannerFound(decodedText)
    }

    function onScannerFound(decodedText) {
      lsDB = newSessionDB()
      var products = lsDB.queryAll("products", {
        query: { product_code: decodedText }
      })

      if (!Array.isArray(products) || products.length != 1) {
        playScannerSound(scannerErrorSound)
        alertE("product not found or corrupted")
        setTimeout(alertClose, 1000)
        return
      }

      var product = products[0]
      var added = onAddToCart(product.ID, product.product_code, product.product_name, product.product_price, 1)
      playScannerSound(added ? scannerBeepSound : scannerErrorSound)
    }

    function onNextScan() {
      html5QrcodeScanner.resume()
    }

    let qrboxFunction = function (viewfinderWidth, viewfinderHeight) {
      let minEdgePercentage = 0.7 // 70%
      let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight)
      let qrboxSize = Math.floor(minEdgeSize * minEdgePercentage)
      return {
        width: qrboxSize,
        height: qrboxSize
      }
    }

    let config = { fps: 10, qrbox: qrboxFunction }
    let html5QrcodeScanner = new Html5QrcodeScanner("reader", config, /* verbose= */ false)
    html5QrcodeScanner.render(onScanSuccess)
  </script>

  <!-- Manual Add Product -->
  <script type="text/javascript">
    function handleEnterKeyPressOnSearchProductCode(e) {
      if (e.keyCode === 13) {
        e.preventDefault()
        onSearchProduct()
      }
    }

    function onSearchClicked() {
      var formSearchProduct = document.getElementById("seach_product_form")
      if (formSearchProduct.style.display === "none") {
        formSearchProduct.style.display = "block"
      } else {
        formSearchProduct.style.display = "none"
      }
    }

    function onSearchProduct() {
      var resultsBody = document.getElementById("tableProduct")
      resultsBody.textContent = ""
      var input = document.getElementById("product_code_search").value.trim().toLowerCase()
      if (input.length < 2) {
        alertE("Enter at least 2 characters to search products")
        return
      }

      lsDB = newSessionDB()
      var catalog = lsDB.queryAll("products")
      if (!Array.isArray(catalog)) {
        console.error("Product search expected the products table to return an array.")
        alertE("Unable to load products. Please reload the page and try again.")
        return
      }

      var searchProducts = []
      for (var productIndex = 0; productIndex < catalog.length; productIndex++) {
        var product = catalog[productIndex]
        if (!product || typeof product !== "object") {
          continue
        }
        var productCode = String(product.product_code || "").toLowerCase()
        var productName = String(product.product_name || "").toLowerCase()
        var productCategory = String(product.product_category || "Uncategorized").toLowerCase()
        if (productCode.includes(input) || productName.includes(input) || productCategory.includes(input)) {
          searchProducts.push(product)
        }
      }

      if (searchProducts.length === 0) {
        var emptyRow = document.createElement("tr")
        var emptyCell = document.createElement("td")
        emptyCell.colSpan = 6
        emptyCell.className = "data-empty"
        emptyCell.textContent = "No matching products found."
        emptyRow.appendChild(emptyCell)
        resultsBody.appendChild(emptyRow)
        return
      }

      for (var resultIndex = 0; resultIndex < searchProducts.length; resultIndex++) {
        let resultProduct = searchProducts[resultIndex]
        var row = document.createElement("tr")
        var values = [resultProduct.ID, resultProduct.product_code, resultProduct.product_name,
        resultProduct.product_category || "Uncategorized"]
        for (var valueIndex = 0; valueIndex < values.length; valueIndex++) {
          var cell = document.createElement("td")
          var value = values[valueIndex]
          cell.textContent = String(value === null || value === undefined ? "" : value)
          row.appendChild(cell)
        }
        var priceCell = document.createElement("td")
        priceCell.className = "text-right"
        priceCell.textContent = String(resultProduct.product_price)
        row.appendChild(priceCell)
        var actionCell = document.createElement("td")
        actionCell.className = "text-center"
        var addButton = document.createElement("button")
        addButton.type = "button"
        addButton.className = "btn btn-sm btn-success"
        addButton.setAttribute("aria-label", "Add " + resultProduct.product_name + " to cart")
        addButton.innerHTML = '<i class="fa fa-plus" aria-hidden="true"></i>'
        addButton.addEventListener("click", function () {
          onAddToCart(resultProduct.ID, resultProduct.product_code, resultProduct.product_name, resultProduct.product_price, 1)
        })
        actionCell.appendChild(addButton)
        row.appendChild(actionCell)
        resultsBody.appendChild(row)
      }
    }

    function clearProductCodeSearch() {
      document.getElementById("product_code_search").value = ""
      document.getElementById("tableProduct").textContent = ""
    }

  </script>

  <!-- Sales/Transaction Table -->
  <script type="text/javascript">
    var editingTransactionId = null

    function handleEnterKeyPressOnPaymentSave(e) {
      if (e.keyCode === 13) {
        e.preventDefault()
        onTotalPaymentSave()
      }
    }

    function onAddToCart(id, productCode, productName, productPrice, qtyValue) {
      var rowId = "pid_" + id
      var price = Number(productPrice)
      var quantityChange = Number(qtyValue)
      if (!Number.isFinite(price) || price < 0 || !Number.isFinite(quantityChange)) {
        alertE("This product has an invalid price or quantity")
        return false
      }

      var row = document.getElementById(rowId)
      var quantity = row ? Number(document.getElementById("pid_qty_" + id).textContent) + quantityChange : quantityChange
      if (!Number.isSafeInteger(quantity) || !Number.isFinite(quantity * price)) {
        alertE("This product quantity or subtotal is too large")
        return false
      }
      if (quantity <= 0) {
        if (row) {
          row.remove()
        }
        calculateTotal()
        return true
      }

      if (!row) {
        row = document.createElement("tr")
        row.id = rowId
        document.getElementById("tableSales").appendChild(row)
      }
      row.textContent = ""

      var nameCell = document.createElement("td")
      nameCell.className = "cart-product-cell"
      nameCell.id = "pid_name_" + productCode
      nameCell.textContent = productName
      nameCell.title = productName
      var quantityCell = document.createElement("td")
      quantityCell.id = "pid_qty_" + id
      quantityCell.className = "text-right"
      quantityCell.textContent = String(quantity)
      var priceCell = document.createElement("td")
      priceCell.id = "pid_price_" + productCode
      priceCell.className = "text-right"
      priceCell.textContent = String(price)
      var subtotalCell = document.createElement("td")
      subtotalCell.id = "pid_subtotal_" + id
      subtotalCell.className = "text-right"
      subtotalCell.textContent = String(quantity * price)
      var actionsCell = document.createElement("td")
      actionsCell.className = "cart-operation-cell"
      var actionButtons = document.createElement("div")
      actionButtons.className = "cart-operation-buttons"

      var addButton = document.createElement("button")
      addButton.type = "button"
      addButton.className = "btn btn-sm btn-success"
      addButton.setAttribute("aria-label", "Add one " + productName)
      addButton.innerHTML = '<i class="fa fa-plus" aria-hidden="true"></i>'
      addButton.addEventListener("click", function () {
        onAddToCart(id, productCode, productName, price, 1)
      })
      var removeButton = document.createElement("button")
      removeButton.type = "button"
      removeButton.className = "btn btn-sm btn-danger"
      removeButton.setAttribute("aria-label", "Remove one " + productName)
      removeButton.innerHTML = '<i class="fa fa-minus" aria-hidden="true"></i>'
      removeButton.addEventListener("click", function () {
        onAddToCart(id, productCode, productName, price, -1)
      })
      actionButtons.appendChild(addButton)
      actionButtons.appendChild(removeButton)
      actionsCell.appendChild(actionButtons)
      row.appendChild(nameCell)
      row.appendChild(quantityCell)
      row.appendChild(priceCell)
      row.appendChild(subtotalCell)
      row.appendChild(actionsCell)
      calculateTotal()
      return true
    }

    function calculateTotal() {
      var subTotal = Array.from(document.querySelectorAll("[id^='pid_subtotal_']"))
      if (subTotal.length != 0) {
        var paidSelection = document.querySelector('input[name="transactionPaid"]:checked')
        var paymentBefore = editingTransactionId === null ? null :
          document.getElementById("totalPayment") && document.getElementById("totalPayment").textContent
        var total = 0
        subTotal.forEach(function (value) {
          var subTotalValue = Number(value.textContent) || 0
          total += subTotalValue
        })
        total = Math.round(total * 100) / 100
        document.getElementById("totalPrice").innerHTML = `<tr>
									<th>Total</th>
									<th colspan="3" id="totalPriceTH" style='text-align:end'>${total}</th>
									<th id="table_sales_operation_tfoot_1"></th>
								</tr>
								<tr>
									<th>Payment</th>
									<th colspan="3" id="totalPayment" style='text-align:end'>${total}</th>
									<th id="table_sales_operation_tfoot_2" style="text-align:center">
										<button class="btn btn-sm btn-warning cart-payment-edit" aria-label="Edit payment amount" onclick="onTotalPaymentEdit()">
											<i class="fa fa-edit"></i>
										</button>
									</th>
								</tr>
								<tr>
									<th>Change</th>
									<th colspan="3" id="totalChange" style='text-align:end'>0</th>
									<th id="table_sales_operation_tfoot_4"></th>
								</tr>
								<tr>
									<th>Paid</th>
									<th colspan="3" style="text-align:end">
										<label class="mr-3"><input type="radio" name="transactionPaid" value="true" onchange="onPaidStatusChange()"> Paid</label>
										<label><input type="radio" name="transactionPaid" value="false" checked onchange="onPaidStatusChange()"> Unpaid</label>
									</th>
									<th></th>
								</tr>`
        if (paidSelection) {
          var paidRadio = document.querySelector('input[name="transactionPaid"][value="' + paidSelection.value + '"]')
          if (paidRadio) {
            paidRadio.checked = true
          }
        }
        if (paymentBefore !== null && paymentBefore !== "" && Number.isFinite(Number(paymentBefore))) {
          document.getElementById("totalPayment").textContent = paidSelection && paidSelection.value === "true"
            ? String(total)
            : paymentBefore
        } else {
          document.getElementById("totalPayment").textContent =
            paidSelection && paidSelection.value === "true" ? String(total) : "0"
        }
        calculatePayment()
      } else {
        document.getElementById("totalPrice").innerHTML = ""
      }
    }

    function onTotalPaymentEdit() {
      var paymentBefore = document.getElementById("totalPayment").innerHTML
      document.getElementById("totalPayment").innerHTML = `<input id="totalPaymentEdit" type="number" min="0" step="any" value="${paymentBefore}" onkeypress="handleEnterKeyPressOnPaymentSave(event)"></input>`
      document.getElementById("table_sales_operation_tfoot_2").innerHTML = `
			<button class="btn btn-sm btn-primary cart-payment-edit" aria-label="Save payment amount" onclick="onTotalPaymentSave()">
				<i class="fas fa-save"></i>
			</button>`
    }

    function restorePaymentEditButton() {
      document.getElementById("table_sales_operation_tfoot_2").innerHTML = `
			<button class="btn btn-sm btn-warning cart-payment-edit" aria-label="Edit payment amount" onclick="onTotalPaymentEdit()">
				<i class="fa fa-edit"></i>
			</button>`
    }

    function onTotalPaymentSave() {
      var paymentAfter = document.getElementById("totalPaymentEdit").value
      var paymentValue = Number(paymentAfter)
      if (!Number.isFinite(paymentValue) || paymentValue < 0) {
        alertE("Enter a valid payment amount")
        return
      }
      document.getElementById("totalPayment").textContent = String(paymentValue)
      restorePaymentEditButton()
      calculatePayment()
    }

    function calculatePayment() {
      var totalPrice = Number(document.getElementById("totalPriceTH").textContent) || 0
      var totalPayment = Number(document.getElementById("totalPayment").textContent) || 0
      document.getElementById("totalPayment").textContent = String(totalPayment)
      document.getElementById("totalChange").textContent =
        String(Math.round((totalPayment - totalPrice) * 100) / 100)
    }

    function onPaidStatusChange() {
      var selectedStatus = document.querySelector('input[name="transactionPaid"]:checked')
      if (!document.getElementById("totalPriceTH") || !selectedStatus) {
        return
      }
      var isPaid = selectedStatus.value === "true"
      document.getElementById("totalPayment").textContent = isPaid
        ? document.getElementById("totalPriceTH").textContent
        : "0"
      restorePaymentEditButton()
      calculatePayment()
    }

    function clearSalesTable() {
      document.getElementById("receipt_ref").innerHTML = ""
      document.getElementById("tableSales").innerHTML = ""
      document.getElementById("totalPrice").innerHTML = ""
      editingTransactionId = null
      if (new URLSearchParams(window.location.search).has("edit")) {
        window.history.replaceState(null, "", window.location.pathname)
      }
      document.querySelector(".page-title").firstChild.nodeValue = "New transaction"
      document.getElementById("save_transaction_label").textContent = "Save sale"
      var unpaidRadio = document.querySelector('input[name="transactionPaid"][value="false"]')
      if (unpaidRadio) {
        unpaidRadio.checked = true
      }
      document.getElementById("customer_name").value = ""
      setPaymentType("cash")
    }

    function requestClearSalesTable() {
      var cartHasItems = document.getElementById("tableSales").children.length > 0
      if (!cartHasItems && editingTransactionId === null) {
        return
      }

      var message = editingTransactionId === null
        ? "Clear all products from the current cart?"
        : "Discard your transaction changes and stop editing this saved transaction?"
      confirmAction(message, clearSalesTable, "Clear cart")
    }

    function requestSaveSalesTransaction(afterSave) {
      if (document.getElementById("tableSales").children.length === 0) {
        saveSalesTransaction()
        return
      }

      var total = document.getElementById("totalPriceTH").textContent
      var payment = document.getElementById("totalPayment").textContent
      var paidRadio = document.querySelector('input[name="transactionPaid"]:checked')
      var status = paidRadio && paidRadio.value === "true" ? "Paid" : "Unpaid"
      var action = editingTransactionId === null ? "Save this sale" : "Save changes to this sale"
      var reference = document.getElementById("receipt_ref").textContent
      var message = action + (reference ? " " + reference : "") +
        "? Total: " + total + ", payment: " + payment + ", status: " + status + "."

      confirmAction(message, function () {
        if (saveSalesTransaction()) {
          var savedReference = document.getElementById("receipt_ref").textContent
          clearSalesTable()
          if (typeof afterSave === "function") {
            afterSave(savedReference)
          }
        }
      }, "Confirm and save")
    }

    function saveSalesTransaction() {
      var tableSales = document.getElementById("tableSales").innerHTML
      if (tableSales == "") {
        alertE("Please add atleast 1 product to save this sales transaction")
        return
      }

      lsDB = newSessionDB()
      var pBuyQty = Array.from(document.querySelectorAll("[id^='pid_qty_']"))
      var pBuyPrice = Array.from(document.querySelectorAll("[id^='pid_price_']"))
      var pBuyPriceTotal = Array.from(document.querySelectorAll("[id^='pid_subtotal_']"))
      var pBuyName = Array.from(document.querySelectorAll("[id^='pid_name_']"))
      var pTotal = document.getElementById("totalPriceTH").textContent
      var pPayment = document.getElementById("totalPayment").textContent
      var pChange = document.getElementById("totalChange").textContent
      var paidRadio = document.querySelector('input[name="transactionPaid"]:checked')
      var customerName = document.getElementById("customer_name").value.trim()
      var paymentType = document.getElementById("payment_type").value

      var trxData = []
      pBuyName.forEach(function (value, i) {
        let data = {
          product_code: value.id.replace("pid_name_", ""),
          product_name: value.textContent,
          product_price: pBuyPrice[i].textContent,
          product_qty: pBuyQty[i].textContent,
          product_price_total: pBuyPriceTotal[i].textContent
        }

        trxData.push(data)
      })

      var existingTransaction = editingTransactionId === null ? null :
        lsDB.queryAll("sales", { query: { ID: editingTransactionId } })[0]
      var newDate = new Date()
      var dateTime = existingTransaction ? existingTransaction.datetime : newDate.toLocaleString("sv-SE")

      var trxRef = document.getElementById("receipt_ref").innerHTML
      if (!trxRef) {
        var referencePrefix = `ST/${queryConfig("merchant_code")}/${queryConfig("pic_code")}`
        var existingReferences = lsDB.queryAll("sales").filter(function (transaction) {
          return String(transaction.reference || "").indexOf(referencePrefix + "/") === 0
        })
        var nextSequence = existingReferences.reduce(function (maximum, transaction) {
          var reference = String(transaction.reference || "")
          var sequence = Number(reference.substring(referencePrefix.length + 1))
          return Number.isSafeInteger(sequence) && sequence > maximum ? sequence : maximum
        }, 0) + 1
        trxRef = `${referencePrefix}/${String(nextSequence).padStart(4, "0")}`
        while (existingReferences.some(function (transaction) {
          return transaction.reference === trxRef
        })) {
          nextSequence += 1
          trxRef = `${referencePrefix}/${String(nextSequence).padStart(4, "0")}`
        }
      }

      var trx = {
        reference: trxRef,
        timestamp: existingTransaction ? existingTransaction.timestamp : newDate / 1000 | 0,
        datetime: dateTime,
        data: trxData,
        total: pTotal,
        payment: pPayment,
        change: pChange,
        paid: paidRadio ? paidRadio.value === "true" : false,
        customer_name: customerName,
        payment_type: paymentType || "cash"
      }

      document.getElementById("receipt_ref").innerHTML = trxRef

      if (editingTransactionId !== null) {
        var updatedCount = lsDB.update("sales", { ID: editingTransactionId }, function () {
          return trx
        })
        if (updatedCount === 0) {
          alertE("This transaction no longer exists. Reload the page before saving.")
          return false
        }
      } else {
        lsDB.insert("sales", trx)
      }
      lsDB.commit()
      return true
    }

    function loadTransactionForEditing() {
      var requestedId = new URLSearchParams(window.location.search).get("edit")
      if (!requestedId) {
        return
      }

      var transactionId = Number(requestedId)
      if (!Number.isSafeInteger(transactionId) || transactionId <= 0) {
        alertE("The requested transaction ID is invalid.")
        return
      }

      lsDB = newSessionDB()
      var records = lsDB.queryAll("sales", { query: { ID: transactionId } })
      if (records.length !== 1) {
        alertE("This transaction could not be found.")
        return
      }

      var transaction = records[0]
      if (!Array.isArray(transaction.data) || transaction.data.length === 0) {
        alertE("This transaction has no product lines to edit.")
        return
      }

      editingTransactionId = transactionId
      var products = lsDB.queryAll("products")
      for (var index = 0; index < transaction.data.length; index += 1) {
        var item = transaction.data[index]
        var name = String(item.product_name || "").trim()
        var code = String(item.product_code || "").trim()
        var quantity = Number(item.product_qty)
        var price = Number(item.product_price)
        if (!name || !Number.isSafeInteger(quantity) || quantity <= 0 ||
          !Number.isFinite(price) || price < 0 || !Number.isFinite(quantity * price)) {
          alertE("This transaction contains a product line that cannot be edited.")
          clearSalesTable()
          return
        }

        var matchingProducts = products.filter(function (product) {
          return String(product.product_code || "") === code
        })
        var cartId = matchingProducts.length === 1 ? matchingProducts[0].ID : "edit_" + index
        onAddToCart(cartId, code || name, name, price, quantity)
      }

      document.getElementById("receipt_ref").textContent = transaction.reference || ""
      document.getElementById("customer_name").value = transaction.customer_name || ""
      setPaymentType(transaction.payment_type || "cash")
      document.getElementById("totalPayment").textContent = transaction.paid
        ? String(Number(transaction.total) || 0)
        : "0"
      calculatePayment()
      var paidRadio = document.querySelector(
        'input[name="transactionPaid"][value="' + (transaction.paid ? "true" : "false") + '"]'
      )
      if (paidRadio) {
        paidRadio.checked = true
      }

      document.querySelector(".page-title").firstChild.nodeValue = "Edit transaction"
      document.getElementById("save_transaction_label").textContent = "Save changes"
      document.querySelector("#table_sales_card").scrollIntoView({ behavior: "smooth", block: "start" })
    }

    function getConfiguredPaymentTypes() {
      var configured = String(queryConfig("payment_types") || "cash,qris,bank_transfer")
        .split(",")
        .map(function (type) { return type.trim() })
        .filter(function (type, index, types) {
          return type && types.findIndex(function (candidate) {
            return candidate.toLowerCase() === type.toLowerCase()
          }) === index
        })
      return configured.length ? configured : ["cash", "qris", "bank_transfer"]
    }

    function setPaymentType(selectedType) {
      var select = document.getElementById("payment_type")
      if (!select) {
        return
      }
      var types = getConfiguredPaymentTypes()
      if (selectedType && !types.some(function (type) {
        return type.toLowerCase() === selectedType.toLowerCase()
      })) {
        types.push(selectedType)
      }
      select.textContent = ""
      types.forEach(function (type) {
        var option = document.createElement("option")
        option.value = type
        option.textContent = type.replace(/_/g, " ").replace(/\b\w/g, function (letter) {
          return letter.toUpperCase()
        })
        select.appendChild(option)
      })
      select.value = types.find(function (type) {
        return type.toLowerCase() === String(selectedType || "cash").toLowerCase()
      }) || types[0]
    }

    setPaymentType("cash")
    loadTransactionForEditing()
  </script>

  <!-- Table Printer -->
  <script type="text/javascript">
    function printTableSales() {
      requestSaveSalesTransaction(openSavedReceiptForPrinting)
    }

    function openSavedReceiptForPrinting(trxRef) {
      var uri = window.location.pathname.replace("index.html", "receipt.html")
      if (!(uri.includes("receipt.html"))) {
        uri += "receipt.html"
      }

      var printWindow = window.open(uri + '?ref=' + encodeURIComponent(trxRef), 'Print', 'left=200, top=200, width=950, height=500, toolbar=0, resizable=0');
      if (!printWindow) {
        alertE("Allow pop-ups to print this receipt")
        return
      }
      printWindow.addEventListener('load', function () {
        printWindow.print();
        setTimeout(function () {
          printWindow.close();
        }, 500);
      }, true);
    }

  </script>
