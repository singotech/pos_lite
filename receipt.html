<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="POS Lite transaction receipt.">
  <title>Receipt · POS Lite</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/cK1Ss7vL/poslite-logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="./css/pos.css">
  <style>
    .receipt-shell {
      width: min(720px, calc(100% - 32px));
      margin: 36px auto;
      padding-bottom: 48px;
    }

    .receipt-toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .receipt-card {
      padding: clamp(22px, 5vw, 42px);
      border: var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 6px 6px 0 var(--ink);
    }

    .receipt-header {
      padding-bottom: 22px;
      border-bottom: 2px dashed #b9b09f;
      text-align: center;
    }

    .receipt-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 13px;
      object-fit: contain;
    }

    .receipt-merchant {
      margin: 0;
      font-size: 24px;
      font-weight: 950;
      letter-spacing: -0.05em;
    }

    .receipt-address {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: pre-line;
    }

    .receipt-title {
      margin: 25px 0 14px;
      font-size: 19px;
      font-weight: 900;
    }

    .receipt-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 21px;
    }

    .receipt-meta-item {
      padding: 11px 12px;
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      background: #fff9e7;
    }

    .receipt-meta-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .receipt-meta-value {
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .receipt-table {
      width: 100%;
      border-collapse: collapse;
    }

    .receipt-table th,
    .receipt-table td {
      padding: 11px 7px;
      border-bottom: 1px solid #e8e1d4;
      font-size: 12px;
      text-align: left;
    }

    .receipt-table th {
      background: #f3eddf;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .receipt-table .numeric {
      text-align: right;
      white-space: nowrap;
    }

    .receipt-totals {
      width: min(290px, 100%);
      margin: 17px 0 0 auto;
    }

    .receipt-total-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 7px 0;
      font-size: 12px;
    }

    .receipt-total-row.final {
      margin-top: 5px;
      padding: 12px;
      border: var(--line);
      border-radius: 6px;
      background: var(--yellow);
      font-size: 15px;
      font-weight: 950;
    }

    .receipt-thanks {
      margin: 27px 0 0;
      padding-top: 18px;
      border-top: 2px dashed #b9b09f;
      color: #39362f;
      font-size: 13px;
      font-weight: 750;
      text-align: center;
      white-space: pre-line;
    }

    .receipt-empty {
      padding: 36px 10px;
      text-align: center;
    }

    .receipt-empty h1 {
      font-size: 25px;
    }

    .receipt-embedded .receipt-shell {
      width: 100%;
      margin: 0;
      padding: 14px;
    }

    .receipt-embedded .receipt-toolbar {
      display: none;
    }

    @media (max-width: 520px) {
      .receipt-shell {
        width: calc(100% - 24px);
        margin-top: 20px;
      }

      .receipt-meta {
        grid-template-columns: 1fr;
      }

      .receipt-table th,
      .receipt-table td {
        padding: 9px 5px;
        font-size: 10px;
      }
    }

    @media print {
      body {
        background: white;
      }

      .receipt-shell {
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .receipt-toolbar {
        display: none;
      }

      .receipt-card {
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .receipt-meta-item,
      .receipt-total-row.final {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>

<body>
  <main class="receipt-shell">
    <div class="receipt-toolbar">
      <a class="button" href="./sales.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Sales report</a>
      <button class="button button-primary" type="button" onclick="window.print()">
        <i class="fa-solid fa-print" aria-hidden="true"></i> Print receipt
      </button>
    </div>
    <article class="receipt-card" id="receipt">
      <header class="receipt-header">
        <img class="receipt-logo" id="merchant_logo" alt="Merchant logo" hidden>
        <h1 class="receipt-merchant" id="merchant_name">POS Lite</h1>
        <p class="receipt-address" id="merchant_address"></p>
      </header>
      <h2 class="receipt-title">Transaction receipt</h2>
      <div class="receipt-meta" id="receipt_info"></div>
      <div class="table-responsive">
        <table class="receipt-table">
          <thead>
            <tr>
              <th scope="col">Product</th>
              <th scope="col" class="numeric">Qty</th>
              <th scope="col" class="numeric">Price</th>
              <th scope="col" class="numeric">Total</th>
            </tr>
          </thead>
          <tbody id="tableSales"></tbody>
        </table>
      </div>
      <div class="receipt-totals" id="totalPrice"></div>
      <p class="receipt-thanks" id="receipt_footer"></p>
    </article>
  </main>

  <script src="js/localstoragedb.min.js"></script>
  <script src="js/database.js"></script>
  <script>
    function setReceiptMeta(label, value) {
      var item = document.createElement("div");
      item.className = "receipt-meta-item";
      var labelNode = document.createElement("span");
      labelNode.className = "receipt-meta-label";
      labelNode.textContent = label;
      var valueNode = document.createElement("span");
      valueNode.className = "receipt-meta-value";
      valueNode.textContent = value || "—";
      item.appendChild(labelNode);
      item.appendChild(valueNode);
      document.getElementById("receipt_info").appendChild(item);
    }

    function setReceiptTotal(label, value, isFinal) {
      var row = document.createElement("div");
      row.className = "receipt-total-row" + (isFinal ? " final" : "");
      var labelNode = document.createElement("span");
      labelNode.textContent = label;
      var valueNode = document.createElement("strong");
      valueNode.textContent = Number(value || 0).toLocaleString();
      row.appendChild(labelNode);
      row.appendChild(valueNode);
      document.getElementById("totalPrice").appendChild(row);
    }

    function initReceipt() {
      var reference = new URL(window.location.href).searchParams.get("ref");
      if (!reference) {
        showMissingReceipt();
        return;
      }

      lsDB = newSessionDB();
      var records = lsDB.queryAll("sales", { query: { reference: reference } });
      if (records.length === 0) {
        showMissingReceipt();
        return;
      }

      var transaction = records[0];
      document.title = "Receipt " + transaction.reference + " · POS Lite";
      document.getElementById("merchant_name").textContent = queryConfig("merchant_name") || "POS Lite";
      document.getElementById("merchant_address").textContent = queryConfig("merchant_address");
      document.getElementById("receipt_footer").textContent = queryConfig("receipt_footer");

      var logoUrl = queryConfig("merchant_logo");
      if (logoUrl) {
        var logo = document.getElementById("merchant_logo");
        logo.src = logoUrl;
        logo.hidden = false;
        logo.onerror = function () {
          logo.hidden = true;
        };
      }

      setReceiptMeta("Reference", transaction.reference);
      setReceiptMeta("Date", transaction.datetime);
      setReceiptMeta("Cashier", queryConfig("pic_name"));
      setReceiptMeta("Status", transaction.paid ? "Paid" : "Unpaid");
      setReceiptMeta("Customer", transaction.customer_name || "Walk-in");
      setReceiptMeta("Payment type", String(transaction.payment_type || "cash")
        .replace(/_/g, " ").replace(/\b\w/g, function (letter) { return letter.toUpperCase(); }));

      var tableBody = document.getElementById("tableSales");
      (Array.isArray(transaction.data) ? transaction.data : []).forEach(function (product) {
        var row = document.createElement("tr");
        [product.product_name, product.product_qty, product.product_price, product.product_price_total]
          .forEach(function (value, index) {
            var cell = document.createElement("td");
            cell.textContent = value === null || value === undefined ? "" : String(value);
            if (index > 0) {
              cell.className = "numeric";
            }
            row.appendChild(cell);
          });
        tableBody.appendChild(row);
      });

      setReceiptTotal("Total", transaction.total, true);
      setReceiptTotal("Payment", transaction.payment, false);
      setReceiptTotal("Change", transaction.change, false);
    }

    function showMissingReceipt() {
      document.title = "Receipt not found · POS Lite";
      document.getElementById("receipt").innerHTML =
        '<div class="receipt-empty"><h1>Receipt not found</h1><p>This transaction may have been removed or the link is incorrect.</p><a class="button button-primary" href="./sales.html">Back to sales</a></div>';
    }

    if (new URL(window.location.href).searchParams.get("embed") === "1") {
      document.body.classList.add("receipt-embedded");
    }
    initReceipt();
  </script>
</body>

</html>
